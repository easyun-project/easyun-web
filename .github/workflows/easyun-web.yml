name: Deploy to Dev Server (EC2)

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy easyun-web via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEPLOY_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ec2-user bash -c \"source /home/ec2-user/.nvm/nvm.sh && cd /home/ec2-user/easyun-web && git pull origin develop && npm ci && npm run build\" && cp /home/ec2-user/easyun-web/deployment/easyun-web.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx"]' \
            --comment "GitHub Actions deploy ${{ github.sha }}" \
            --timeout-seconds 120 \
            --output text \
            --query "Command.CommandId")

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --output text \
              --query "Status" 2>/dev/null || echo "Pending")

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --output text \
                --query "StandardErrorContent"
              exit 1
            fi

            sleep 5
          done

          echo "Deploy timed out"
          exit 1
